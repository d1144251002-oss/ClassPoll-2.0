name: ClassPoll browser acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run browser UI contract tests with mock Supabase
        run: npm run test:ui
        env:
          CI: "true"
      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: classpoll-browser-traces
          path: test-results/
          retention-days: 7
