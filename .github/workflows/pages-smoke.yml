name: ClassPoll deployed-pages smoke test

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  deployed-pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live homepage, teacher page, student page and JS
        shell: bash
        run: |
          set -euo pipefail
          root="https://d1144251002-oss.github.io/ClassPoll-2.0"
          for endpoint in "/" "/teacher.html" "/student.html" "/js/common.js" "/js/teacher.js" "/js/student.js"; do
            echo "Checking ${root}${endpoint}"
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 25 "${root}${endpoint}" -o /tmp/classpoll-smoke-body
            test -s /tmp/classpoll-smoke-body
          done
          curl --fail --silent --show-error --location --max-time 25 "${root}/teacher.html" | grep -q "loginForm"
          curl --fail --silent --show-error --location --max-time 25 "${root}/student.html" | grep -q "joinForm"
          echo "Live GitHub Pages endpoints available."
